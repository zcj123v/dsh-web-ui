packages:
  - 'shared'
  - 'packages/*'
  - 'packages/skins/*'

# SDK peers 不自动安装，运行时由 DSH profile 树解析
# （原 true 只为聚合包发布时解析 peers，现已不需要）。
autoInstallPeers: false

# 0.1.5-rc.1 起上游把若干平台模块的运行时依赖从 dependencies 降级成
# devDependencies，但发布的 lib/*.js 里仍是裸导入（client-store →
# zustand/immer；ui-primitives → anser / shiki / katex / markdown 工具链）。
# 浏览器侧不受影响（平台模块由 shell 模块表解析），但 vitest 会 inline
# @deepseek-ai/*，必须能解析被 inline 模块的每一条 import，且 dsh-client-store
# 的 store 引擎是测试里真实执行的行为。packageExtensions 在安装层补回这些依赖，
# 不改动任何已发布包的 manifest；上游修好后整段删除。
packageExtensions:
  '@deepseek-ai/dsh-client-store@0.1.5-rc.1':
    dependencies:
      immer: ^10.1.1
      zustand: ~4.4.7
  '@deepseek-ai/dsh-client-ui-primitives@0.1.5-rc.1':
    dependencies:
      '@shikijs/langs': ^4.3.1
      anser: ^2.3.5
      clsx: ^2.0.0
      katex: ^0.16.47
      mdast-util-from-markdown: ^2.0.3
      mdast-util-gfm: ^3.1.0
      mdast-util-math: ^3.0.0
      micromark-core-commonmark: ^2.0.3
      micromark-extension-gfm: ^3.0.0
      micromark-extension-math: ^3.1.0
      micromark-factory-space: ^2.0.1
      micromark-util-character: ^2.1.1
      micromark-util-classify-character: ^2.0.1
      micromark-util-sanitize-uri: ^2.0.1
      micromark-util-symbol: ^2.0.1
      micromark-util-types: ^2.0.2
      shiki: ^4.3.1

allowBuilds:
  # The cloudflared postinstall downloads the platform binary (the auto-tunnel
  # feature ships its own tunnel client — users install nothing).
  cloudflared: true
  cpu-features: true
  esbuild: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-default-model@0.1.0-rc.6'
  - '@deepseek-ai/dsh-agent@0.1.0-rc.6 || 0.1.5-rc.1'
